name: Close issues labeled wontfix

on:
  issues:
    types: [labeled]

jobs:
  close-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Close issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.issue;
            if (context.payload.label.name === 'wontfix') {
              github.rest.issues.update({
                owner: issue.owner,
                repo: issue.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }
